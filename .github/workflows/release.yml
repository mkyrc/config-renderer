name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  create-version-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate VERSION format
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$VERSION" ]]; then
            echo "VERSION file is empty"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be in SemVer format X.Y.Z, got: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not exist
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi

      - name: Create and push release tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tag image
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          IMAGE="ghcr.io/${{ github.repository }}:${TAG}"
          docker buildx build --push --tag "$IMAGE" .

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp src/jinja_config_renderer.html public/index.html
          cp VERSION public/VERSION
          APP_VERSION="$(tr -d '\r\n' < VERSION)"
          sed -i "s|__APP_VERSION__|${APP_VERSION}|g" public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Prepare release notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          IMAGE="ghcr.io/${{ github.repository }}:${TAG}"
          PACKAGE_URL="https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}"
          README_URL="https://github.com/${{ github.repository }}#readme"
          PAGES_URL="${{ steps.deployment.outputs.page_url }}"

          cat > release-notes.md <<EOF

          # Config Generator Release $TAG
          
          ## Docker Image

          - Tag: $TAG
          - Image: $IMAGE
          - Package page: $PACKAGE_URL

          ## Run with Docker

              docker pull $IMAGE
              docker run --rm -p 8080:8080 --name config-generator $IMAGE

          Open in browser: http://localhost:8080

          ## Usage

          Web app (GitHub Pages): $PAGES_URL

          See README: $README_URL

          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
